# Security gates, identical in every Optivail repo. Built to be deterministic:
# tool versions and actions are pinned (downloads checksum-verified), semgrep
# only fails on findings that are new relative to the base commit, and every
# job has a timeout. Nothing here publishes or deploys.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catches new advisories for unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  OSV_VERSION: "2.2.2"
  OSV_SHA256: "c799274b682e0437c802d4714a136ad09b39c65547c460049ba5358d28afa576"
  SEMGREP_VERSION: "1.182.1"

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -fsSL --retry 3 -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
      - name: Scan full history (false positives go in .gitleaksignore)
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install osv-scanner (checksum-verified)
        run: |
          curl -fsSL --retry 3 -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Known vulnerabilities in lockfiles (exceptions in osv-scanner.toml, with reason and expiry)
        run: |
          set +e
          ./osv-scanner scan source -r .
          rc=$?
          # 128 = no lockfiles/manifests found: nothing to check, not a failure
          if [ "$rc" -eq 128 ]; then echo "no manifests"; exit 0; fi
          exit "$rc"

  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet "semgrep==${SEMGREP_VERSION}"
      - name: Semgrep, ERROR only, new findings only
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ -n "$BASE_REF" ]; then
            base=$(git merge-base HEAD "origin/$BASE_REF")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          args=(--metrics=off --config p/default --severity ERROR --error)
          if [ -n "$base" ]; then
            semgrep scan "${args[@]}" --baseline-commit "$base"
          else
            # scheduled/manual run: report everything, never fail on pre-existing findings
            semgrep scan "${args[@]}" || echo "::warning::semgrep reports existing findings (see log)"
          fi
