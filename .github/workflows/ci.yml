name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Byte-compile
        run: python -m compileall -q backend
      - name: Boots and answers /api/stats
        working-directory: backend
        run: |
          data=$(mktemp -d)
          GATEKEEP_DATA_DIR=$data GATEKEEP_HOST=127.0.0.1 python main.py > "$data/log" 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9477/api/stats && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:9477/api/stats || { cat "$data/log"; exit 1; }
          kill "$pid"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
