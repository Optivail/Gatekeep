name: ci

on:
  push:
    branches: [main, go-backend]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Byte-compile
        run: python -m compileall -q backend
      - name: Boots and answers /api/stats
        working-directory: backend
        run: |
          data=$(mktemp -d)
          GATEKEEP_DATA_DIR=$data GATEKEEP_HOST=127.0.0.1 python main.py > "$data/log" 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9477/api/stats && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:9477/api/stats || { cat "$data/log"; exit 1; }
          kill "$pid"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: tests (race)
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  parity:
    # Self-contained: uses only committed files (the backend/tests dir is
    # gitignored). Engine corpus is generated by CPython and checked by Go;
    # HTTP parity runs both servers against a fake upstream.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python reference deps
        run: pip install -r backend/requirements.txt
      - name: Build Go server
        working-directory: server
        run: go build -o "$RUNNER_TEMP/gatekeep-go" .
      - name: Engine differential (Python reference vs Go)
        working-directory: server
        run: |
          python -I parity/engine_cases.py --out "$RUNNER_TEMP/engines.jsonl" --count 5000 --seed 1
          GK_PARITY_CORPUS="$RUNNER_TEMP/engines.jsonl" go test -count=1 -run Parity -v ./engines
      - name: HTTP parity (both servers, fake upstream)
        run: python -I server/parity/http_parity.py --go-bin "$RUNNER_TEMP/gatekeep-go" --py-dir backend
