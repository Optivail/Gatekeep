name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Byte-compile
        run: python -m compileall -q backend
      - name: Boots and answers /api/stats
        working-directory: backend
        run: |
          data=$(mktemp -d)
          GATEKEEP_DATA_DIR=$data GATEKEEP_HOST=127.0.0.1 python main.py > "$data/log" 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9477/api/stats && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:9477/api/stats || { cat "$data/log"; exit 1; }
          kill "$pid"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
